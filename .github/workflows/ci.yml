name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests
      - run: python -m mypy src
      - run: python -m pytest -q

  build:
    name: Build and inspect distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python tools/check_dist.py dist
      - name: Install and import built wheel in a fresh environment
        run: |
          python -m venv /tmp/elscript-wheel-check
          /tmp/elscript-wheel-check/bin/python -m pip install dist/*.whl
          /tmp/elscript-wheel-check/bin/python -m pip show elscript-audio
          /tmp/elscript-wheel-check/bin/python -c "import elscript; print(elscript.__version__)"
          /tmp/elscript-wheel-check/bin/elscript --help
      - uses: actions/upload-artifact@v6
        with:
          name: elscript-audio-distributions
          path: dist/*
          if-no-files-found: error
