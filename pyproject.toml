[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "elscript-audio"
version = "0.1.0a0"
description = "Render structured, expressive, multi-character scripts to speech."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "ELScript contributors" }]
keywords = ["audio", "elevenlabs", "speech", "text-to-speech", "yaml"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Typing :: Typed",
]
dependencies = [
  "av>=18,<19",
  "pydantic>=2.10",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.14",
  "pytest>=8.3",
  "pytest-cov>=6",
  "ruff>=0.9",
  "twine>=6.1",
  "types-PyYAML>=6.0",
]

[project.scripts]
elscript = "elscript.cli:main"

[project.urls]
Changelog = "https://github.com/brifl/ELScript/blob/main/CHANGELOG.md"
Documentation = "https://github.com/brifl/ELScript#readme"
Issues = "https://github.com/brifl/ELScript/issues"
Repository = "https://github.com/brifl/ELScript"

[tool.hatch.build.targets.wheel]
packages = ["src/elscript"]

[tool.hatch.build.targets.sdist]
include = [
  "/CHANGELOG.md",
  "/DESIGN.md",
  "/LICENSE",
  "/README.md",
  "/docs",
  "/pyproject.toml",
  "/src",
  "/tests",
  "/tools/check_dist.py",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --capture=sys"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["elscript"]
