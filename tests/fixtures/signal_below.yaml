elscript: "1.0"

meta:
  id: signal-below
  title: "The Signal Below"
  description: "ELScript feature demonstration"
  language: en
  tags: [demo, science-fiction]

render:
  provider: fake
  mode: auto
  model: eleven_v3
  output_format: wav_16000
  timestamps: true
  seed: 771943
  text_normalization: auto
  language_text_normalization: false
  enable_logging: true
  chunking:
    max_chars: 1800
    prefer_scene_boundaries: true
    prefer_utterance_boundaries: true
    preserve_continuity: true

pronunciation:
  terms:
    Calypso:
      ipa: "kəˈlɪpsoʊ"
    XJ-9:
      say_as: "X J Nine"

presets:
  narrator:
    emotion: neutral
    intensity: 0.25
    energy: 0.30
    pace: measured
    volume: normal
    delivery: [cinematic, restrained]
  human:
    emotion: neutral
    intensity: 0.40
    energy: 0.50
    pace: normal
    volume: normal
  machine:
    emotion: neutral
    intensity: 0.15
    energy: 0.30
    pace: measured
    volume: normal
    delivery: [precise, calm, understated]

characters:
  NARRATOR:
    voice_id: VOICE_NARRATOR
    preset: narrator
  ELLIS:
    voice_id: VOICE_ELLIS
    preset: human
    defaults:
      emotion: tired
      intensity: 0.35
  CALYPSO:
    voice_id: VOICE_CALYPSO
    preset: machine
    model: eleven_v3
    defaults:
      emotion: neutral
      delivery: [precise, calm]

scenes:
  - id: station
    order: 10
    title: "The Station"
    context: >
      Ellis is repairing an abandoned research station.
      Calypso is the station AI.
    inherit_character_state: false
    script:
      - NARRATOR: >
          At 2:17 in the morning, the station spoke for the first time
          in eleven years.
      - pause: 0.7
      - CALYPSO:
          cue: [soft inhale]
          say: Ellis.
      - ELLIS:
          set:
            emotion: startled
            intensity: 0.65
            energy: 0.70
          say: Jesus!
      - ELLIS:
          set:
            intensity: 0.45
          say: Calypso? You said voice synthesis was offline.
      - CALYPSO: It was.
      - ELLIS:
          set:
            emotion: suspicious
            pace: slow
          say: Was?
      - CALYPSO:
          set:
            emotion: concerned
            intensity: 0.30
          say:
            - text: I restored the subsystem because I require your attention.
            - cue: short pause
            - with:
                volume: quiet
                delivery: [carefully]
              text: Immediately.
      - ELLIS:
          cue: [sighs]
          set:
            emotion: irritated
            intensity: 0.45
          say: It's two in the morning.
      - CALYPSO: Two seventeen.
      - ELLIS:
          tags: [sarcastic]
          say: Thank you, Calypso.
      - CALYPSO:
          with:
            emotion: curious
          say: Was that sarcasm?
      - ELLIS: "Yes."
      - CALYPSO: Understood.
      - pause: 0.4
      - CALYPSO:
          set:
            emotion: concerned
            intensity: 0.50
          say: The seismic array has detected a repeating signal.
      - ELLIS:
          reset: pace
          set:
            emotion: confused
          say: A seismic signal?
      - CALYPSO: "No."
      - CALYPSO:
          set:
            intensity: 0.65
          say:
            - text: A radio signal.
            - cue: long pause
            - with:
                volume: quiet
              text: From beneath the station.
      - pause: 1.0
      - ELLIS:
          set:
            emotion: uneasy
            intensity: 0.60
            pace: slow
          say: That's impossible.
      - CALYPSO:
          with:
            delivery: [very gently]
          say: I know.
      - ELLIS:
          say:
            - text: How far beneath us?
            - set:
                emotion: frightened
                intensity: 0.72
            - cue: nervous breath
            - with:
                volume: quiet
              text: Calypso... how far?
      - CALYPSO:
          set:
            emotion: apprehensive
            intensity: 0.55
          say: Four meters.
      - marker: reveal
      - pause: 1.4
      - NARRATOR:
          set:
            emotion: ominous
            intensity: 0.50
          say: Ellis looked down at the concrete floor.
      - ELLIS:
          with:
            volume: whisper
          say: There's no basement.
      - CALYPSO:
          cue: [softly]
          say: I am aware.
      - note: End of demonstration scene.

export:
  mode: single
  normalize_loudness: false
  manifest:
    enabled: true
    include_source_text: true
  metadata:
    save_request_ids: true
    save_voice_segments: true
    save_character_timestamps: true
    save_normalized_timestamps: true
